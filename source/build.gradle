plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.0-m41-highpower.0.81.5-city-a3.61'
group = 'cn.academy'
base { archivesName = 'academy-generation-reborn' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.252'
    runs {
        client { client(); if(providers.gradleProperty('canonExperimental').getOrElse('false').toBoolean())systemProperty 'academy.canon.experimental','true'; gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('clientDirectory').getOrElse('run-client')); if(providers.gradleProperty('visualQA').getOrElse('false').toBoolean())systemProperty 'academy.visual.qa','true'; if(providers.gradleProperty('wirelessQA').getOrElse('false').toBoolean())systemProperty 'academy.wireless.qa','true' }
        server { server(); gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('serverDirectory').getOrElse('run-server')); if (providers.gradleProperty('urbanWorldgenProbe').isPresent()) systemProperty 'academy.urban.worldgenProbe', providers.gradleProperty('urbanWorldgenProbe').get(); if (providers.gradleProperty('canonExperimental').getOrElse('false').toBoolean()) systemProperty 'academy.canon.experimental','true'; programArgument '--nogui' }
        highPowerGameTest {
            type = 'gameTestServer'
            if(providers.gradleProperty('canonExperimental').getOrElse('false').toBoolean())systemProperty 'academy.canon.experimental','true'
            jvmArgument '-Xms256m'
            jvmArgument '-Xmx2048m'
            if (providers.gradleProperty('nativeSeamExport').getOrElse('false').toBoolean()) systemProperty 'mixin.debug.export', 'true'
            // Read-only far-coordinate witness for the hold controller; off unless explicitly requested.
            if (providers.gradleProperty('constructFarDiagnostic').getOrElse('false').toBoolean()) systemProperty 'academy.highpower.constructFarDiagnostic', 'true'
            // Read-only NEW132 controller lifecycle witness (start/finish reason); off unless explicitly requested.
            if (providers.gradleProperty('groundStepDiagnostic').getOrElse('false').toBoolean()) systemProperty 'academy.highpower.groundStepDiagnostics', 'true'
            // Each independent suite needs fresh SavedData; reused worlds exhaust retained custody caps.
            // An explicit directory remains available for intentional restart/persistence fixtures.
            gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('highPowerTestDirectory').getOrElse(
                    'run-highpower-gametest-isolated/' + java.util.UUID.randomUUID().toString()))
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('highPowerTestNamespaces').getOrElse('academy_highpower,academy_highpower_needle_capacity,academy_highpower_spatial_consent,academy_highpower_spatial_corridor,academy_highpower_borrowed,academy_highpower_array,academy_highpower_vector,academy_braking_touch_runtime,academy_windblade_runtime,academy_inertial_anchor_runtime,academy_yaw_palm_runtime,academy_trajectory_return_runtime,academy_circulation_relief_runtime,academy_circulation_listening_runtime,academy_vector_cage_runtime,academy_multi_axis_reflection,academy_wind_pressure_lift,academy_point_meltdown_runtime,academy_remote_scatter_relay_runtime,academy_scatter_locator_runtime,academy_control_hold_runtime,academy_autonomous_vector_circle,academy_magnetic_domain_team,academy_new_skills_runtime,academy_construct_runtime,academy_cast_pose,academy_esper_guard')
            // Legacy native-accounting fixtures hit enrolled espers with magic/wither/kill damage; the esper guard and growth styles are off for them and forced on by academy_esper_guard.
            systemProperty 'academy.esperLegacyBypass', 'true'
            if (providers.gradleProperty('auditOnly').isPresent()) systemProperty 'academy.audit.only', providers.gradleProperty('auditOnly').get()
            if (providers.gradleProperty('debugLease').isPresent()) systemProperty 'academy.debug.lease', 'true'
            // GameTests assert the closed vanilla contract; open compatibility (the shipped default) is exercised by its own tests.
            if (!providers.gradleProperty('openCompatTest').getOrElse('false').toBoolean()) systemProperty 'academy.compat.strict', 'true'
        }
        gameTestServer {
            type = 'gameTestServer'
            // Independent run directories prevent test fixtures from touching client/server saves.
            gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('gameTestDirectory').getOrElse('run-gametest'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'academy'
            systemProperty 'academy.compat.strict', 'true'
        }
        restartGameTest {
            type = 'gameTestServer'
            gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('restartDirectory').getOrElse('run-restart'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'academy_restart'
            systemProperty 'academy.restart.phase', providers.gradleProperty('restartPhase').getOrElse('verify')
            programArgument '--world'
            programArgument 'academy-restart-world'
        }
    }
    mods { academy { sourceSet(sourceSets.main) } }
}
repositories {
    if (file('.gradle/local-maven').exists()) maven { url = uri('.gradle/local-maven'); content { includeGroup 'software.bernie.geckolib' } }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'; content { includeGroup 'software.bernie.geckolib' } }
    mavenCentral()
    // Optional physics linkage (V-ADV-01): Sable is compile-only; ACA runs without it and enables the bridge only when it is installed.
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter { includeGroup 'dev.ryanhcode.sable'; includeGroup 'dev.ryanhcode.sable-companion' }
    }
    // Optional JEI recipe pages: API is compile-only; the plugin class loads only when JEI is installed.
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei' }
    }
}
dependencies {
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7'
    jarJar('software.bernie.geckolib:geckolib-neoforge-1.21.1') {
        version { strictly '[4.7,4.8)'; prefer '4.7' }
    }
    compileOnly('dev.ryanhcode.sable:sable-neoforge-1.21.1:2.0.6') { transitive = false }
    compileOnly('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0') { transitive = false }
    // Compile against the oldest published 1.21.1 JEI API so newer-only methods cannot crash older JEI installs.
    def jeiApi = providers.gradleProperty('jeiApiVersion').getOrElse('19.8.4.110')
    compileOnly("mezz.jei:jei-1.21.1-common-api:${jeiApi}") { transitive = false }
    compileOnly("mezz.jei:jei-1.21.1-neoforge-api:${jeiApi}") { transitive = false }
}
