// ExFAT metadata companions are not JVM classes, packs, or mods. ModDev run tasks are not JavaExec.
def removeAppleDouble = { File root ->
    if (root.exists()) root.eachFileRecurse(groovy.io.FileType.FILES) { if (it.name.startsWith('._')) it.delete() }
}
def generatedMetadataCleaned = false
tasks.withType(JavaExec).configureEach {
    doFirst {
        if (!generatedMetadataCleaned) {
            removeAppleDouble(layout.buildDirectory.dir('classes').get().asFile)
            removeAppleDouble(layout.buildDirectory.dir('resources').get().asFile)
            removeAppleDouble(file('src'))
            generatedMetadataCleaned = true
        }
    }
}
tasks.matching { it.name.startsWith('run') }.configureEach {
    doFirst {
        removeAppleDouble(layout.buildDirectory.get().asFile)
        removeAppleDouble(file('src'))
        ['run-showcase/mods', 'run-showcase-sable/mods', 'run-compat-gametest/mods'].each { removeAppleDouble(file(it)) }
    }
}
tasks.withType(Jar).configureEach { exclude '**/._*' }

