// The explicit reviewed runtime must agree with the actual packaged identity.
// Keep the contract lists deliberate; never infer approval from a runtime mod count or name.
tasks.register('verifyHighPowerVersionContract') {
    inputs.file('src/main/resources/META-INF/neoforge.mods.toml')
    inputs.files('src/main/java/cn/academy/port/highpower/VanillaCombatContract.java',
                 'src/main/java/cn/academy/port/highpower/VanillaMiningContract.java')
    inputs.file('src/main/java/cn/academy/port/gametest/HighPowerCombatRuntimeTests.java')
    inputs.property('artifactVersion', project.version.toString())
    doLast {
        def expected = project.version.toString()
        if (!file('src/main/resources/META-INF/neoforge.mods.toml').text.contains('version="' + expected + '"'))
            throw new GradleException('Packaged mod metadata does not match the reviewed artifact version')
        if (!file('src/main/java/cn/academy/port/gametest/HighPowerCombatRuntimeTests.java').text.contains('"academy", "' + expected + '"'))
            throw new GradleException('Native reviewed-version fixture requires an explicit version update')
        ['VanillaCombatContract', 'VanillaMiningContract'].each { name ->
            if (!file('src/main/java/cn/academy/port/highpower/' + name + '.java').text.contains('"academy", "' + expected + '"'))
                throw new GradleException(name + ' requires an explicit reviewed version update')
        }
    }
}
tasks.named('processResources') { dependsOn 'verifyHighPowerVersionContract' }

