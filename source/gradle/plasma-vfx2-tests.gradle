tasks.register('plasmaVfx2TimelineTest', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'cn.academy.port.client.PlasmaVfx2TimelineRegressionTest'
 enableAssertions = true
}
tasks.named('check') { dependsOn 'plasmaVfx2TimelineTest' }
tasks.register('plasmaVfx2IntegrationTest', Exec) {
    commandLine 'python3', 'scripts/verify-plasma-vfx2-integration.py', '--report', layout.buildDirectory.file('reports/plasma-vfx2-integration.json').get().asFile.absolutePath
}
tasks.named('check') { dependsOn 'plasmaVfx2IntegrationTest' }

// Resolve the existing configured Gradle cache; the verifier still enforces its original JOML SHA.
tasks.named('plasmaVfx2IntegrationTest', Exec) {
    doFirst {
        def jars = fileTree(new File(gradle.gradleUserHomeDir, 'caches/modules-2/files-2.1/org.joml/joml/1.10.5')) { include '**/joml-1.10.5.jar' }.files
        if (jars.size() != 1) throw new GradleException('Expected one cached JOML 1.10.5 archive')
        args '--joml', jars.first().absolutePath
    }
}
